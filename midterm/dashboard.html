<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function cites(ids, a) {
  return ids.map(id => {
    const text = esc(a.evidence[id] || "");
    const url = a.evidence_links && a.evidence_links[id];
    return url
      ? `<a class="cite" href="${esc(url)}" target="_blank" rel="noopener" title="${text}">${esc(id)}</a>`
      : `<span class="cite" title="${text}">${esc(id)}</span>`;
  }).join("");
}

function checkBadge(c) {
  const pctText = c.check_confidence != null ? ` ${Math.round(c.check_confidence * 100)}%` : "";
  const tip = c.check_reason || (c.check_confidence != null ? `Checker confidence${pctText}` : "");
  if (c.check === "partly") return `<span class="conf partly" title="${esc(tip)}">partly supported${pctText}</span>`;

}

function claims(list, a, outlook) {
  if (!list || !list.length) return `<p class="empty">No supported claims.</p>`;
  return list.map(c => `<p class="claim">${esc(c.claim)}${cites(c.cites, a)}` +
    checkBadge(c) +
    (outlook ? `<span class="conf">${esc(c.confidence || "")}</span><span class="basis">${esc(c.basis || "")}</span>` : "") +
    `</p>`).join("");
}

function coverageBars(perDay) {
  const days = [...perDay].reverse();  // oldest first, today last
  const max = Math.max(...days, 1);
  return `<div class="bars">` + days.map((n, i) => {
    const label = i === days.length - 1 ? "today" : `-${days.length - 1 - i}d`;
    return `<div><em>${n}</em><i style="height:${(n / max) * 100}%"></i><small>${label}</small></div>`;

  const dir = m.momentum >= 1.2 ? "up" : m.momentum <= 0.8 ? "down" : "";
  const intents = f.intent.filter(i => i.share > 0).map(i =>
    `<div class="row" title="${esc(i.examples.join(", "))}"><span>${esc(i.intent)}</span>
     <span class="track"><i style="width:${pct(i.share)}"></i></span><span class="n">${pct(i.share)}</span></div>`).join("");
  const drivers = f.drivers.map(d =>
    `<span class="chip">${esc(d.word)}<b>${d.lift === null ? "new" : d.lift + "×"}</b></span>`).join("");
  const events = f.events.slice(0, 6).map(ev =>
    `<li><a href="${esc(ev.url)}" target="_blank" rel="noopener">${esc(ev.title)}</a>
     <div class="meta">${esc(ev.source)} · ${esc(ev.published.slice(0, 10))} · dates: ${esc(ev.dates_mentioned.join(", "))}</div></li>`).join("");
  const searches = (a.related_searches || []).slice(0, 14).map(s => `<span class="chip">${esc(s.phrase)}</span>`).join("");
  const evidence = Object.entries(a.evidence).map(([id, text]) => {
    const url = a.evidence_links && a.evidence_links[id];
    return `<li><b>${esc(id)}</b> ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text)}</li>`;
  }).join("");

  const explanation = e.error
    ? `<div class="card wide"><p class="empty">Explanation failed: ${esc(e.error)}</p></div>`
    : `<div class="card"><h3>Why people search it</h3>${claims(e.why_people_search, a)}</div>
       <div class="card"><h3>What is happening</h3>${claims(e.what_is_happening, a)}</div>
       <div class="card wide"><h3>What is likely next</h3>${claims(e.outlook, a, true)}
         ${e.caveats && e.caveats.length ? `<p class="note">Caveats: ${e.caveats.map(esc).join(" · ")}</p>` : ""}
         ${e.unsupported_claims_removed ? `<p class="note">${e.unsupported_claims_removed} claim(s) without valid citations were removed.</p>` : ""}
         ${e.failed_check_removed ? `<p class="note">${e.failed_check_removed} claim(s) failed the evidence check and were removed.</p>` : ""}
         ${a.writer_model ? `<p class="note">Written by ${esc(a.writer_model)} from the evidence below.</p>` : ""}
         ${e.checked_by ? `<p class="note">Claims checked against their evidence by ${e.checked_by === "jev" ? "Jev (a decision model that can only answer supported / partly / unsupported, with a probability)" : "a second text-model pass"}.</p>` : ""}
       </div>`;

  return `<section>
    <h2>${esc(a.topic)}</h2>
    <p class="sub">${esc(a.geo)} · data collected ${esc(a.source_collected_at.slice(0, 16).replace("T", " "))} UTC</p>
    ${a.source_errors && a.source_errors.length ? `<p class="note">Sources that failed this time: ${a.source_errors.map(esc).join(" · ")}</p>` : ""}
    <div class="grid">
      <div class="card">
        <h3>News coverage</h3>
        ${f.news_unavailable ? `<div class="stats">
          <div class="stat"><b>${Object.keys(a.evidence).filter(k => k.startsWith("S")).length}</b><span>articles found with Google Search</span></div>
        </div>` : `<div class="stats">
          <div class="stat"><b>${m.today}</b><span>articles today</span></div>
          <div class="stat"><b>${m.previous_daily_average}</b><span>per day before</span></div>
          <div class="stat"><b class="${dir}">${m.momentum}×</b><span>momentum</span></div>
        </div>`}
        ${f.news_unavailable ? `<p class="note">Daily article counts (momentum) need the Google News feed, which refuses Cloudflare's servers. They are available in the local version.</p>` : coverageBars(m.per_day)}
        ${f.spam_removed ? `<p class="note">${f.spam_removed} spam headline(s) (gambling sites stuffing keywords) were removed before counting.</p>` : ""}
      </div>
      <div class="card"><h3>What searchers want</h3>${intents}<p class="note">From Google autocomplete phrases. Hover a row for examples.</p></div>
      <div class="card"><h3>What people type with it</h3><div class="chips">${searches}</div></div>
      <div class="card"><h3>Today's news drivers</h3><div class="chips">${drivers || '<span class="empty">None</span>'}</div>
        <p class="note">Words far more common in today's headlines than earlier.</p></div>
      ${a.google_search ? `<div class="card wide"><h3>News found with Google Search</h3>
        <p class="note">Articles come from ${esc(a.news_source)}. Only articles Google attached a source citation to are used${a.google_search.dropped_uncited > 0 ? ` (${a.google_search.dropped_uncited} without a citation were dropped)` : ""}. Searches Google ran: ${(a.google_search.queries || []).map(esc).join(", ")}</p>
        <div class="google-suggestions">${a.google_search.suggestions || ""}</div></div>` : ""}
      <div class="card wide"><h3>Scheduled events in the news</h3><ul class="clean">${events || '<li class="empty">None found</li>'}</ul></div>
      ${explanation}
      <div class="card wide"><details><summary>All evidence given to the model (${Object.keys(a.evidence).length} items)</summary>
        <ul class="clean evidence">${evidence}</ul></details></div>
    </div>
  </section>`;
}

function generalSection(s) {
  if (!s) return "";
  const trends = s.google_trends.slice(0, 15).map(t =>
    `<li><b>${esc(t.term)}</b> <span class="meta">${esc(t.traffic_text)}</span>
     ${t.news[0] ? `<div class="meta"><a href="${esc(t.news[0].url)}" target="_blank" rel="noopener">${esc(t.news[0].title)}</a></div>` : ""}</li>`).join("");
  const wiki = s.wikipedia_top.slice(0, 15).map(w =>
    `<li>${esc(w.title)} <span class="meta">${w.views.toLocaleString()} views</span></li>`).join("");
  return `<section>
    <h2>Trending right now (${esc(s.geo)})</h2>
    <p class="sub">Collected ${esc(s.collected_at.slice(0, 16).replace("T", " "))} UTC</p>
    <div class="grid">
      <div class="card"><h3>Google Trends</h3><ul class="clean">${trends}</ul></div>
      <div class="card"><h3>Most-viewed Wikipedia (${esc(s.wiki_day)})</h3><ul class="clean">${wiki}</ul></div>
    </div>
  </section>`;
}

document.getElementById("topics").innerHTML = DATA.analyses.length
  ? DATA.analyses.map(topicSection).join("")
  : `<p class="empty">No analyses yet. Run analyze_topic.py first.</p>`;
document.getElementById("general").innerHTML = generalSection(DATA.snapshot);

// Live mode (served by app.py): search any topic.
if (DATA.live) {
  const form = document.getElementById("search"), status = document.getElementById("status");
  const button = document.getElementById("go");
  form.hidden = false;
  const passwordInput = document.getElementById("password");
  if (DATA.needs_password) {
    passwordInput.hidden = false;
    passwordInput.required = true;
    try { passwordInput.value = sessionStorage.getItem("searchPassword") || ""; } catch {}
  }
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const topic = document.getElementById("topic").value.trim();
    if (!topic) return;
    button.disabled = true;
    status.className = "";
    const started = Date.now();
    const tick = setInterval(() => {
      const s = Math.round((Date.now() - started) / 1000);
      status.textContent = `Collecting searches and news for "${topic}", then analyzing… ${s}s (usually 30-60s)`;
    }, 500);
    try {
      const response = await fetch("/api/analyze", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({topic, region: document.getElementById("region").value, password: passwordInput.value}),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || response.statusText);
      try { if (DATA.needs_password) sessionStorage.setItem("searchPassword", passwordInput.value); } catch {}
      document.getElementById("result").innerHTML = topicSection(result);
      status.textContent = `Done in ${Math.round((Date.now() - started) / 1000)}s.`;
      document.getElementById("result").scrollIntoView({behavior: "smooth"});
    } catch (error) {
      status.className = "error";
      status.textContent = "Failed: " + error.message;
    } finally {
      clearInterval(tick);
      button.disabled = false;
    }
  });
}
</script>
</body>
</html>

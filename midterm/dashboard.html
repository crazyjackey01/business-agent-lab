<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Signals</title>
<!-- Pretendard: a Korean UI face drawn to sit evenly with Latin letters and digits -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* Layout: a briefing sheet. One question per result, the answer first, sources at the foot.
     Main column reads; the side column holds the measured search data. */
  :root {
    --paper: #f5f6f4;        /* page ground, faintly green-grey */
    --sheet: #ffffff;        /* reading surface */
    --ink: #17201f;          /* text */
    --ink-soft: #5d6866;     /* secondary text */
    --rule: #dfe3e1;         /* hairlines */
    --accent: #146b63;       /* deep teal: links, bars, active tab */
    --accent-soft: #e2efed;
    --ok: #2f8a57;           /* check: supported */
    --warn: #c38a12;         /* check: partly */
    --unsure: #9aa3a1;       /* check: uncertain / unchecked */
    /* One family throughout; weight and size carry the hierarchy. */
    --sans: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --serif: var(--sans);
    --mono: var(--sans);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #101514; --sheet: #171e1d; --ink: #e6ebe9; --ink-soft: #9aa6a3; --rule: #2a3432;
      --accent: #6cc3b8; --accent-soft: #1d3330; --ok: #5cc48a; --warn: #e2b04a; --unsure: #6e7977;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #101514; --sheet: #171e1d; --ink: #e6ebe9; --ink-soft: #9aa6a3; --rule: #2a3432;
    --accent: #6cc3b8; --accent-soft: #1d3330; --ok: #5cc48a; --warn: #e2b04a; --unsure: #6e7977;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sheet); color: var(--ink); font: 15px/1.7 var(--sans); word-break: keep-all; overflow-wrap: anywhere; }
  /* Digits line up wherever numbers sit in rows or columns. */
  .fact b, .bar-row .n, table.usage .num, table.trends .vol, .kicker, sup.ref, .timeline time, ol.plain li::before { font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }

  /* Top bar */
  header.top { border-bottom: 1px solid var(--ink); background: var(--sheet); }
  header.top .wrap:first-child { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px 4px; }
  .brand { font: 700 18px/1 var(--sans); letter-spacing: -0.02em; white-space: nowrap; }
  .brand small { display: block; font: 400 12px/1.4 var(--sans); color: var(--ink-soft); margin-top: 4px; letter-spacing: 0; }
  form.search { flex: 1 1 420px; display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
  form.search input, form.search select, form.search button {
    font: inherit; font-size: 14px; border: 1px solid var(--rule); border-radius: 4px;
    padding: 9px 12px; background: var(--paper); color: var(--ink); min-width: 0; }
  form.search #topic { flex: 1 1 240px; font-size: 15px; }
  form.search #password { flex: 0 1 150px; }
  form.search button { background: var(--accent); border-color: var(--accent); color: var(--sheet); font-weight: 600; cursor: pointer; }
  form.search button:disabled { opacity: .6; cursor: wait; }
  #status { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--ink-soft); min-height: 1.3em; }
  #status.error { color: var(--warn); }

  nav.tabs { display: flex; gap: 4px; }
  nav.tabs button { font: 500 14px var(--sans); background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 10px 10px 10px; color: var(--ink-soft); cursor: pointer; }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  nav.tabs .count { font: 400 12px var(--mono); color: var(--ink-soft); margin-left: 4px; }

  main { padding-block: 28px 64px; }

  /* Result sheet */
  .sheet { padding-block: 8px 0; }
  .kicker { font: 500 13px var(--sans); color: var(--ink-soft); }
  h1.q { font: 700 clamp(26px, 4vw, 32px)/1.3 var(--sans); margin: 4px 0 12px; text-wrap: balance; letter-spacing: -0.025em; }
  .answer { font: 500 clamp(17px, 2.1vw, 19px)/1.7 var(--sans); margin: 0 0 20px; max-width: 44em; letter-spacing: -0.01em; color: var(--ink); }
  .facts-row { display: flex; flex-wrap: wrap; gap: 8px 32px; padding-block: 14px; border-block: 1px solid var(--rule); margin-bottom: 26px; }
  .fact b { display: block; font: 700 22px/1.25 var(--sans); letter-spacing: -0.02em; }
  .fact span { font-size: 12px; color: var(--ink-soft); }

  .cols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 40px; }
  @media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); gap: 28px; } }
  h2.sec { font: 700 15px var(--sans); letter-spacing: -0.01em; color: var(--ink); margin: 0 0 10px; }
  .block + .block { margin-top: 28px; }
  ul.claims { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; max-width: 42em; }
  ul.claims li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 9px; background: var(--unsure); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); }
  .basis { display: block; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .conf { font: 500 11px var(--sans); color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
  sup.ref { font: 600 10px var(--sans); margin-left: 2px; }
  sup.ref a, sup.ref span { text-decoration: none; color: var(--accent); cursor: help; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-soft); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  /* Side column */
  aside .panel + .panel { margin-top: 26px; }
  .bar-row { display: grid; grid-template-columns: 88px minmax(0, 1fr) 36px; gap: 8px; align-items: center; font-size: 13px; margin: 6px 0; }
  .track { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--accent); }
  .bar-row .n { text-align: right; font: 400 12px var(--mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  ol.plain, ul.plain { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
  ol.plain { counter-reset: item; }
  ol.plain li { display: grid; grid-template-columns: 22px minmax(0, 1fr); counter-increment: item; }
  ol.plain li::before { content: counter(item); font: 400 12px var(--mono); color: var(--ink-soft); padding-top: 2px; }
  .timeline li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; font-size: 13px; }
  .timeline time { font: 500 12px var(--mono); color: var(--accent); padding-top: 1px; }
  .muted { color: var(--ink-soft); font-size: 13px; }

  /* Sources + how it was made */
  .foot { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--rule); display: grid; gap: 20px; }
  ol.sources { margin: 0; padding-left: 26px; display: grid; gap: 4px; font-size: 13px; }
  ol.sources li::marker { font: 400 12px var(--mono); color: var(--ink-soft); }
  ol.sources li:target { background: var(--accent-soft); }
  ol.sources .src { color: var(--ink-soft); }
  details.how > summary { cursor: pointer; font-size: 13px; color: var(--ink-soft); }
  details.how[open] > summary { margin-bottom: 12px; }
  .how-grid { display: grid; gap: 16px; font-size: 13px; }
  .how-grid h3 { font: 700 13px var(--sans); color: var(--ink); margin: 0 0 4px; }
  table.usage { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.usage td, table.usage th { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--rule); }
  table.usage .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .scroll-x { overflow-x: auto; }
  .google-suggestions { overflow-x: auto; }

  /* Trending now */
  table.trends { width: 100%; border-collapse: collapse; }
  table.trends td { padding: 12px 10px 12px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  table.trends td.rank { font: 400 12px var(--mono); color: var(--ink-soft); width: 28px; padding-top: 15px; }
  table.trends .term { font-weight: 600; }
  table.trends .vol { font: 400 12px var(--mono); color: var(--ink-soft); margin-left: 8px; white-space: nowrap; }
  table.trends .why { display: block; font-size: 14px; margin-top: 2px; }
  table.trends .why .dot { display: inline-block; margin: 0 6px 1px 0; vertical-align: middle; }
  .chip { font: 500 12px var(--sans); color: var(--ink-soft); margin-left: 8px; white-space: nowrap; }
  .chip + .chip::before { content: "· "; }
  .mix { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 0 0 6px; background: var(--rule); }
  .mix i { display: block; height: 100%; }
  .mix-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-soft); }
  .mix-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  /* History */
  ul.history { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
  ul.history li { border-bottom: 1px solid var(--rule); }
  ul.history button { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 16px; padding: 14px 4px; cursor: pointer; }
  ul.history button:hover { background: var(--accent-soft); }
  ul.history button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  ul.history .t { font: 600 16px var(--sans); letter-spacing: -0.01em; }
  ul.history .s { grid-column: 1 / -1; font-size: 13px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ul.history .d { font: 400 12px var(--mono); color: var(--ink-soft); }
  .empty { color: var(--ink-soft); padding: 40px 0; text-align: center; }

</style>
</head>

<header class="top">

</main>

<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = x => Math.round(x * 100) + "%";
// Times in the searchers' own zone, the way a Korean reader writes them.
const ZONES = { KR: "Asia/Seoul", US: "America/New_York" };
function when(iso, geo = "KR") {
  if (!iso) return "";
  const d = new Date(iso.endsWith("Z") || /[+-]\d\d:\d\d$/.test(iso) ? iso : iso + "Z");
  return new Intl.DateTimeFormat("ko-KR", { timeZone: ZONES[geo] || "Asia/Seoul", month: "long", day: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: false }).format(d);
}
const REGION = { KR: "한국", US: "미국" };

const INTENT_NAMES = {
  buying: "구매·이용", investing: "투자", learning: "학습", technology: "기술", definition: "뜻·개념",
  problems: "문제·리스크", companies: "기업", policy: "정책", industries: "산업 적용", outlook: "전망",
  events: "행사", jobs: "취업", news: "뉴스", other: "기타",
};
const CATEGORY_NAMES = {
  breaking_news: "사건·사고", politics: "정치", economy: "경제", sports: "스포츠", entertainment: "연예·문화",
  scheduled_event: "예정된 행사", product_or_tech: "제품·기술", weather_or_seasonal: "날씨·계절", other: "기타",
};
const CATEGORY_COLORS = ["#146b63", "#4f8fc0", "#c38a12", "#8a5cb8", "#c0564f", "#5c9a4a", "#7a8a88", "#b07a4f", "#9aa3a1"];

// Citations: [S] ids become numbered sources in order of first use; [D]/[T] stay data refs.
function makeRefs(result) {
  const order = [];
  return {
    order,
    // skip: an id not worth showing here (a trend row's reference to itself).
    html(ids, skip) {
      const parts = [], data = [];
      for (const id of ids || []) {
        if (id === skip) continue;
        const text = esc(result.evidence?.[id] || "");
        const url = result.evidence_links?.[id];
        if (id.startsWith("S") && url) {
          let n = order.indexOf(id);
          if (n < 0) { order.push(id); n = order.length - 1; }
          parts.push(`<a href="#src-${esc(result._key)}-${n + 1}" title="${text}">${n + 1}</a>`);
        } else if (id.startsWith("T")) {
          parts.push(`<span title="${text}">#${esc(id.slice(1))}</span>`);  // trend rank
        } else {
          data.push(text);
        }
      }
      // All measured-data refs of one sentence collapse into a single "data" marker.
      if (data.length) parts.push(`<span title="${data.join("&#10;")}">data</span>`);
      return parts.length ? `<sup class="ref">${parts.join(" ")}</sup>` : "";
    },
  };
}

function dotClass(c) {
  if (c.check_uncertain) return "";
  return c.check === "supported" ? "ok" : c.check === "partly" ? "warn" : "";
}
function dotTitle(c) {
  const p = c.check_confidence != null ? ` (${Math.round(c.check_confidence * 100)}%)` : "";
  const label = c.check_uncertain ? "불확실" : c.check === "supported" ? "출처와 일치"
    : c.check === "partly" ? "일부만 일치" : "검증 안 됨";
  return label + p + (c.check_reason ? ` · ${c.check_reason}` : "");
}
function claimList(list, refs, outlook) {
  if (!list || !list.length) return `<p class="muted">출처로 뒷받침되는 내용이 없다.</p>`;
  return `<ul class="claims">${list.map(c => `<li>
      <span class="dot ${dotClass(c)}" title="${esc(dotTitle(c))}"></span>
      <div>${esc(c.claim)}${refs.html(c.cites)}${outlook && c.confidence ? `<span class="conf">가능성 ${esc(({ low: "낮음", medium: "보통", high: "높음" })[c.confidence] || c.confidence)}</span>` : ""}
        ${outlook && c.basis ? `<span class="basis">${esc(c.basis)}</span>` : ""}</div>
    </li>`).join("")}</ul>`;
}
const legend = `<div class="legend"><span><i style="background:var(--ok)"></i>출처와 일치</span>
  <span><i style="background:var(--warn)"></i>일부만 일치</span><span><i style="background:var(--unsure)"></i>불확실</span></div>`;

function sourcesFoot(result, refs) {
  const items = refs.order.map((id, n) => {
    const parts = (result.evidence[id] || "").split(" | ");
    const title = parts.length >= 3 ? parts[2] : parts[parts.length - 1];
    const meta = parts.length >= 3 ? `${parts[1]} · ${parts[0]}` : "";
    return `<li id="src-${esc(result._key)}-${n + 1}"><a href="${esc(result.evidence_links[id])}" target="_blank" rel="noopener">${esc(title)}</a>${meta ? `<span class="src"> · ${esc(meta)}</span>` : ""}</li>`;
  }).join("");
  return items ? `<div><h2 class="sec">출처</h2><ol class="sources">${items}</ol></div>` : "";
}

function usageTable(usage) {
  if (!usage || !usage.length) return "";
  const total = usage.reduce((s, u) => s + (u.cost || 0), 0);
  return `<div><h3>사용량 · $${total.toFixed(4)}</h3><div class="scroll-x"><table class="usage">
    <tr><th>단계</th><th>모델</th><th class="num">토큰 입력 / 출력</th><th class="num">비용</th></tr>
    ${usage.map(u => `<tr><td>${esc(u.step)}</td><td>${esc(u.model)}</td>
      <td class="num">${u.input_tokens.toLocaleString()} / ${u.output_tokens.toLocaleString()}</td>
      <td class="num">${u.cost == null ? "무료" : "$" + u.cost.toFixed(4)}</td></tr>`).join("")}
  </table></div></div>`;
}

// Topic result ---------------------------------------------------------------
function topicSheet(a) {
  const f = a.facts, e = a.explanation || {}, m = f.coverage || {};
  const refs = makeRefs(a);
  const articleCount = Object.keys(a.evidence).filter(k => k.startsWith("S")).length;
  const topIntent = (f.intent || []).find(i => i.intent !== "other");
  const allClaims = ["why_people_search", "what_is_happening", "outlook"].flatMap(s => e[s] || []);
  const supported = allClaims.filter(c => c.check === "supported" && !c.check_uncertain).length;

  const summary = e.summary || (e.what_is_happening || [])[0];
  const answer = summary ? `<p class="answer">${esc(summary.claim)}${refs.html(summary.cites)}</p>` : "";

  const facts = [
    f.news_unavailable
      ? `<div class="fact"><b>${articleCount}건</b><span>구글 검색으로 찾은 기사</span></div>`
      : `<div class="fact"><b>${m.momentum}배</b><span>평소 대비 기사량 (오늘 ${m.today}건)</span></div>`,
    topIntent ? `<div class="fact"><b>${pct(topIntent.share)}</b><span>검색 목적 1위: ${esc(INTENT_NAMES[topIntent.intent] || topIntent.intent)}</span></div>` : "",
    allClaims.length ? `<div class="fact"><b>${supported}/${allClaims.length}</b><span>출처와 일치한 문장</span></div>` : "",
    f.relevance?.method === "Jev" ? `<div class="fact"><b>${f.relevance.dropped.length}건</b><span>관련 없어 뺀 기사</span></div>` : "",
  ].join("");

  const intents = (f.intent || []).filter(i => i.share >= 0.02).slice(0, 7).map(i =>
    `<div class="bar-row" title="${esc(i.examples.join(", "))}"><span>${esc(INTENT_NAMES[i.intent] || i.intent)}</span>
     <span class="track"><i style="width:${pct(i.share)}"></i></span><span class="n">${pct(i.share)}</span></div>`).join("");
  const searches = (a.related_searches || []).slice(0, 8).map(s => `<li><span>${esc(s.phrase)}</span></li>`).join("");
  const events = (f.events || []).slice(0, 5).map(ev =>
    `<li><time>${esc(ev.dates_mentioned[0])}</time><a href="${esc(ev.url)}" target="_blank" rel="noopener">${esc(ev.title)}</a></li>`).join("");
  let coverage = "";
  if (!f.news_unavailable && m.per_day) {
    const days = [...m.per_day].reverse(), max = Math.max(...days, 1);
    coverage = `<div class="panel"><h2 class="sec">하루 기사 수</h2>
      <svg viewBox="0 0 280 72" width="100%" role="img" aria-label="최근 7일 하루 기사 수">
        ${days.map((n, i) => `<rect x="${i * 40 + 6}" y="${58 - (n / max) * 48}" width="28" height="${(n / max) * 48 + 1}" rx="3"
          fill="${i === days.length - 1 ? "var(--accent)" : "var(--accent-soft)"}"><title>${n} articles</title></rect>
          <text x="${i * 40 + 20}" y="70" font-size="9" text-anchor="middle" fill="var(--ink-soft)">${i === days.length - 1 ? "오늘" : (days.length - 1 - i) + "일 전"}</text>`).join("")}
      </svg></div>`;
  }

  const body = e.error ? `<p class="muted">분석을 쓰지 못했다: ${esc(e.error)}</p>` : `
    <div class="block"><h2 class="sec">왜 찾나</h2>${claimList(e.why_people_search, refs)}</div>
    <div class="block"><h2 class="sec">무슨 일</h2>${claimList(e.what_is_happening, refs)}</div>
    <div class="block"><h2 class="sec">다음은</h2>${claimList(e.outlook, refs, true)}</div>`;

  const removed = (e.unsupported_claims_removed || 0) + (e.failed_check_removed || 0);
  const how = `<details class="how"><summary>이 분석은 어떻게 만들었나</summary><div class="how-grid">
      <div><h3>과정</h3>기사: ${esc(a.news_source || "Google News feed")}. 검색 목적 분류: ${esc(f.intent_method || "word lists")}.
        작성: ${esc(a.writer_model || "text model")}. 문장마다 인용한 출처와 맞는지 ${e.checked_by === "jev" ? "Jev" : "두 번째 모델"}가 검사했다.
        ${removed ? ` 근거 없는 문장 ${removed}개를 뺐다.` : ""}</div>
      ${f.relevance?.dropped?.length ? `<div><h3>관련 없어 뺀 기사 (Jev)</h3><ul class="plain">${f.relevance.dropped.map(d =>
        `<li><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a> <span class="muted">${d.relevance == null ? "" : "관련도 " + pct(d.relevance)}</span></li>`).join("")}</ul></div>` : ""}
      ${f.spam_removed ? `<div><h3>스팸</h3>키워드를 끼워 넣은 도박 사이트 기사 ${f.spam_removed}건을 세기 전에 뺐다.</div>` : ""}
      ${(a.source_errors || []).length ? `<div><h3>실패한 소스</h3>${a.source_errors.map(esc).join("<br>")}</div>` : ""}
      ${e.caveats?.length ? `<div><h3>한계</h3>${e.caveats.map(esc).join("<br>")}</div>` : ""}
      ${usageTable(a.usage)}
      <div><h3>작성 모델에게 준 근거 전체</h3><ul class="plain">${Object.entries(a.evidence).map(([id, t]) =>
        `<li><span class="muted">${esc(id)}</span> ${esc(t)}</li>`).join("")}</ul></div>
    </div></details>`;

  // Google's terms: grounded results show its search suggestions.
  const google = a.google_search?.suggestions
    ? `<div><h2 class="sec">구글에서 검색한 말</h2><div class="google-suggestions">${a.google_search.suggestions}</div></div>` : "";

  return `<article class="sheet">
    <div class="kicker">${esc(REGION[a.geo] || a.geo)} · ${esc(when(a.analyzed_at || a.source_collected_at, a.geo))} 기준</div>
    <h1 class="q">${esc(a.topic)}</h1>
    ${answer}
    <div class="facts-row">${facts}</div>
    <div class="cols">
      <div>${body}</div>
      <aside>
        ${intents ? `<div class="panel"><h2 class="sec">검색하는 목적</h2>${intents}<p class="muted">구글 자동완성 문구 기준</p></div>` : ""}
        ${coverage}
        ${searches ? `<div class="panel"><h2 class="sec">함께 많이 치는 말</h2><ol class="plain">${searches}</ol></div>` : ""}
        ${events ? `<div class="panel"><h2 class="sec">기사에 나온 날짜</h2><ul class="plain timeline">${events}</ul></div>` : ""}
      </aside>
    </div>
    <div class="foot">${legend}${sourcesFoot(a, refs)}${google}${how}</div>
  </article>`;
}

// Trending now -----------------------------------------------------------------
function overviewSheet(o) {
  const e = o.explanation || {};
  const refs = makeRefs(o);
  const counts = {};
  o.rows.forEach(r => { const c = r.category || "other"; counts[c] = (counts[c] || 0) + 1; });
  const cats = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const color = i => CATEGORY_COLORS[i % CATEGORY_COLORS.length];
  const mix = cats.map(([c, n], i) => `<i style="width:${n / o.rows.length * 100}%;background:${color(i)}" title="${esc(CATEGORY_NAMES[c] || c)} ${n}"></i>`).join("");
  const mixLegend = cats.map(([c, n], i) => `<span><i style="background:${color(i)}"></i>${esc(CATEGORY_NAMES[c] || c)} ${n}</span>`).join("");
  const rows = o.rows.map((r, i) => {
    const why = (r.why || [])[0];
    return `<tr><td class="rank">${i + 1}</td><td>
      <span class="term">${esc(r.term)}</span><span class="vol">${esc(r.traffic_text)}</span>
      ${r.category ? `<span class="chip" title="Jev ${r.category_confidence != null ? pct(r.category_confidence) : ""}">${esc(CATEGORY_NAMES[r.category] || r.category)}</span>` : ""}
      ${r.on_wikipedia ? `<span class="chip">위키백과 상위</span>` : ""}
      ${why ? `<span class="why"><span class="dot ${dotClass(why)}" title="${esc(dotTitle(why))}"></span>${esc(why.claim)}${refs.html(why.cites, r.id)}</span>`
            : r.top_article ? `<span class="why muted"><a href="${esc(r.top_article.url)}" target="_blank" rel="noopener">${esc(r.top_article.title)}</a></span>` : ""}
    </td></tr>`;
  }).join("");
  const themes = e.themes?.length ? claimList(e.themes, refs) : "";
  return `<article class="sheet">
    <div class="kicker">${esc(REGION[o.geo] || o.geo)} · 구글 트렌드 · ${esc(when(o.analyzed_at, o.geo))} 기준</div>
    <h1 class="q">지금 사람들이 가장 많이 검색하는 것</h1>
    ${themes ? `<div class="block">${themes}</div>` : ""}
    <div class="block"><h2 class="sec">어떤 검색어인가</h2><div class="mix" aria-hidden="true">${mix}</div><div class="mix-legend">${mixLegend}</div></div>
    <div class="block scroll-x"><table class="trends">${rows}</table></div>
    <div class="foot">${legend}${sourcesFoot(o, refs)}
      <details class="how"><summary>이 분석은 어떻게 만들었나</summary><div class="how-grid">
        <div>검색어와 연결 기사는 구글 트렌드에서 가져왔다. 분류는 Jev, 설명은 ${esc(o.writer_model || "text model")}가 썼고, 문장마다 인용한 기사와 맞는지 Jev가 검사했다.
          ${e.error ? `<br>설명 작성 실패: ${esc(e.error)}` : ""}</div>
        ${usageTable(o.usage)}
      </div></details>
    </div>
  </article>`;
}

function snapshotSheet(s) {
  if (!s) return `<p class="empty">아직 데이터가 없다. 검색창을 비우고 분석을 눌러 보자.</p>`;
  return `<article class="sheet">
    <div class="kicker">${esc(REGION[s.geo] || s.geo)} · 구글 트렌드 · ${esc(when(s.collected_at, s.geo))} 기준</div>
    <h1 class="q">지금 사람들이 가장 많이 검색하는 것</h1>
    <p class="muted">아직 설명 전이다. 검색창을 비우고 분석을 누르면 검색어마다 이유를 붙인다.</p>
    <ol class="plain">${s.google_trends.slice(0, 15).map(t => `<li><span><b>${esc(t.term)}</b> <span class="muted">${esc(t.traffic_text)}</span>
      ${t.news[0] ? `<br><a href="${esc(t.news[0].url)}" target="_blank" rel="noopener">${esc(t.news[0].title)}</a>` : ""}</span></li>`).join("")}</ol>
  </article>`;
}

// Views --------------------------------------------------------------------------
const results = (DATA.analyses || []).map((a, i) => ({ ...a, _key: "h" + i }));
let current = results[0] || null;

function renderNow() {
  const o = DATA.overview ? { ...DATA.overview, _key: "now" } : null;
  document.getElementById("view-now").innerHTML = o ? overviewSheet(o) : snapshotSheet(DATA.snapshot);
}
function renderTopic() {
  document.getElementById("view-topic").innerHTML = current ? topicSheet(current)
    : `<p class="empty">아직 분석한 주제가 없다. 위에 주제를 입력하고 분석을 누르자.</p>`;
}
function renderHistory() {
  document.getElementById("history-count").textContent = results.length ? String(results.length) : "";
  document.getElementById("view-history").innerHTML = results.length ? `<ul class="history">${results.map((a, i) => {
    const s = a.explanation?.summary || (a.explanation?.what_is_happening || [])[0];
    return `<li><button data-i="${i}"><span class="t">${esc(a.topic)}</span><span class="d">${esc(REGION[a.geo] || a.geo)} · ${esc(when(a.analyzed_at || a.source_collected_at, a.geo))}</span>
      ${s ? `<span class="s">${esc(s.claim)}</span>` : ""}</button></li>`;
  }).join("")}</ul>` : `<p class="empty">분석한 주제가 여기에 쌓인다.</p>`;
  document.querySelectorAll("ul.history button").forEach(b => b.addEventListener("click", () => {
    current = results[+b.dataset.i]; renderTopic(); show("topic");
  }));
}

function show(view) {
  for (const v of ["now", "topic", "history"]) {
    document.getElementById("view-" + v).hidden = v !== view;
    document.getElementById("tab-" + v).setAttribute("aria-selected", String(v === view));
  }
  try { history.replaceState(null, "", "#" + view); } catch {}
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.view)));

document.getElementById("today").textContent = new Intl.DateTimeFormat("ko-KR",
  { timeZone: "Asia/Seoul", year: "numeric", month: "long", day: "numeric", weekday: "long" }).format(new Date());
renderNow(); renderTopic(); renderHistory();
const start = location.hash.slice(1);
show(["now", "topic", "history"].includes(start) ? start : (DATA.overview || !current ? "now" : "topic"));

// Live mode (served by app.py or the Worker): run searches -------------------------
if (DATA.live) {
  const form = document.getElementById("search"), status = document.getElementById("status");
  const button = document.getElementById("go"), passwordInput = document.getElementById("password");
  form.hidden = false;
  if (DATA.needs_password) {
    passwordInput.hidden = false;
    try { passwordInput.value = sessionStorage.getItem("searchPassword") || ""; } catch {}
  }
  form.addEventListener("submit", async event => {
    event.preventDefault();
    const topic = document.getElementById("topic").value.trim();
    if (DATA.needs_password && !passwordInput.value) {
      status.className = "error"; status.textContent = "비밀번호를 입력해야 분석할 수 있다."; return;
    }
    button.disabled = true;
    status.className = "";
    const started = Date.now();
    const tick = setInterval(() => {
      const s = Math.round((Date.now() - started) / 1000);
      status.textContent = topic
        ? `"${topic}" 구글 검색과 분석 중… ${s}초 (보통 1~2분)`
        : `지금 뜨는 검색어를 모으고 이유를 찾는 중… ${s}초 (보통 30초 안)`;
    }, 500);
    try {
      const response = await fetch("/api/analyze", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ topic, region: document.getElementById("region").value, password: passwordInput.value }),
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || response.statusText);
      try { if (DATA.needs_password) sessionStorage.setItem("searchPassword", passwordInput.value); } catch {}
      if (result.kind === "overview") {
        DATA.overview = result; renderNow(); show("now");
      } else {
        current = { ...result, _key: "r" + Date.now() };
        results.unshift(current); renderTopic(); renderHistory(); show("topic");
      }
      status.textContent = `${Math.round((Date.now() - started) / 1000)}초 만에 끝났다.`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (error) {
      status.className = "error";
      status.textContent = "분석 실패: " + error.message;
    } finally {
      clearInterval(tick);
      button.disabled = false;
    }
  });
}
</script>
</body>
</html>
